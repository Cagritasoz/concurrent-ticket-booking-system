name: CI

on:
  push:
    branches:
      - main
      - "milestone/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A throwaway Postgres for the migration targets below. It exists only during this job, so its
    # password is not a secret. The tests don't use it: they start their own with Testcontainers,
    # the same way as on a developer's machine.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: ticketing
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ticketing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing -d ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Install the Go version named in go.mod, so CI and go.mod can't disagree.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Same version as in docs/open/08-development.md. A new version can report new issues, so
      # it is upgraded on purpose, not automatically.
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          args: ./cmd/... ./internal/... ./migrations/...

      # No TEST_DATABASE_URL: pgtest starts Postgres with Testcontainers (the runner has Docker).
      - name: Test
        run: make test

      # The make targets themselves, run the way a developer runs them: apply, roll back, apply.
      - name: Migrations
        run: |
          make migrate-up
          make migrate-down
          make migrate-up
        env:
          DATABASE_URL: postgres://ticketing:ci-only-password@localhost:5432/ticketing?sslmode=disable

      - name: Build
        run: make build
